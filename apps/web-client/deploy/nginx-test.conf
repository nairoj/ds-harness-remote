# Production Remote Web site on 5555 and pre-release staging site on 5556.
# The existing relay on 443 remains unchanged.
server {
    listen 5555 ssl;
    server_name 47.102.38.163;
    ssl_certificate /etc/letsencrypt/live/47.102.38.163/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.102.38.163/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/dsh-remote-web/current/dist;
    index index.html;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /native/index.html {
        add_header Cache-Control "no-store";
    }
    location = /resource-sw.js {
        add_header Cache-Control "no-store";
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 47.102.38.163;
        proxy_set_header Origin https://47.102.38.163;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
    location = /ws/v1/connect {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host 47.102.38.163;
        proxy_set_header Origin https://47.102.38.163;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /brand-whale.webp {
        proxy_pass http://127.0.0.1:8080;
    }
    location /native/ {
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

